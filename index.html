        // Flatten helpers — build a flat list for global indexing
        // =====================================================================
        const flatQuizzes = [];          // { moduleIdx, quizIdx, quiz, moduleName, folder }
        const moduleScores = [];         // [{ correct, total }]  per module
        const quizScores = [];           // [{ correct, total }]  per flat quiz

        modules.forEach((mod, mi) => {
            let modTotal = 0;
            mod.quizzes.forEach((q, qi) => {
                flatQuizzes.push({ moduleIdx: mi, quizIdx: qi, quiz: q, moduleName: mod.name, folder: mod.folder });
                quizScores.push({ correct: 0, total: q.answers.length });
                modTotal += q.answers.length;
            });
            moduleScores.push({ correct: 0, total: modTotal });
        });

        const totalBlanks = quizScores.reduce((a, b) => a + b.total, 0);

        // =====================================================================
        // State
        // =====================================================================
        let currentFlatIndex = 0;   // index into flatQuizzes
        let globalScore = 0;

        // =====================================================================
        // Element refs
        // =====================================================================
        const menuContainer = document.getElementById('sidebar-menu');
        const codeDisplay = document.getElementById('code-display');
        const lineNumbersEl = document.getElementById('line-numbers');
        const sectionTitle = document.getElementById('section-title');
        const fileNameDisplay = document.getElementById('current-file-name');
        const scoreDisplay = document.getElementById('score-counter');
        const totalDisplay = document.getElementById('total-blanks');
        const checkBtn = document.getElementById('check-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const feedbackMsg = document.getElementById('feedback-message');

        // =====================================================================
        // Sidebar — collapsible folder tree
        // =====================================================================
        function buildSidebar() {
            menuContainer.innerHTML = '';
            let flatIdx = 0;  // tracks position in flatQuizzes

            modules.forEach((mod, mi) => {
                const ms = moduleScores[mi];
                const modComplete = ms.correct === ms.total;

                // ── Folder header row ──
                const folderRow = document.createElement('div');
                folderRow.className = 'folder-header';

                const left = document.createElement('div');
                left.className = 'flex items-center gap-1 truncate';

                // Chevron
                const chevron = document.createElement('svg');
                chevron.setAttribute('width', '16');
                chevron.setAttribute('height', '16');
                chevron.setAttribute('viewBox', '0 0 16 16');
                chevron.setAttribute('fill', 'currentColor');
                chevron.className = `folder-chevron ${mod.expanded ? '' : 'collapsed'}`;
                chevron.innerHTML = '<path d="M6 4l4 4-4 4z"/>';

                // Folder icon
                const folderIcon = document.createElement('span');
                folderIcon.className = 'mr-1';
                folderIcon.textContent = mod.expanded ? '📂' : '📁';

                const folderName = document.createElement('span');
                folderName.className = 'truncate';
                folderName.textContent = mod.folder;

                left.appendChild(chevron);
                left.appendChild(folderIcon);
                left.appendChild(folderName);

                // Module score badge
                const badge = document.createElement('span');
                let bc = 'quiz-score-badge ';
                if (modComplete) bc += 'bg-green-900/60 text-green-400 border border-green-700/50';
                else if (ms.correct > 0) bc += 'bg-yellow-900/40 text-yellow-400 border border-yellow-700/50';
                else bc += 'bg-gray-700/50 text-gray-500 border border-gray-600/30';
                badge.className = bc;
                badge.textContent = `${ms.correct}/${ms.total}`;

                folderRow.appendChild(left);
                folderRow.appendChild(badge);
                menuContainer.appendChild(folderRow);

                // ── Children container ──
                const children = document.createElement('div');
                children.className = `folder-children ${mod.expanded ? '' : 'collapsed'}`;
                // set max-height for animation
                children.style.maxHeight = mod.expanded ? `${mod.quizzes.length * 40}px` : '0';

                mod.quizzes.forEach((quiz, qi) => {
                    const fi = flatIdx++;
                    const qs = quizScores[fi];
                    const isActive = fi === currentFlatIndex;
                    const qComplete = qs.correct === qs.total;

                    const fileRow = document.createElement('div');
                    fileRow.className = `file-item ${isActive ? 'active' : 'text-gray-400'}`;

                    // File icon + name
                    const fileLeft = document.createElement('div');
                    fileLeft.className = 'flex items-center gap-1.5 truncate';

                    const pyIcon = document.createElement('span');
                    pyIcon.className = 'text-yellow-400 text-xs flex-shrink-0';
                    pyIcon.textContent = '🐍';

                    const fname = document.createElement('span');
                    fname.className = 'truncate';
                    fname.textContent = quiz.filename;

                    fileLeft.appendChild(pyIcon);
                    fileLeft.appendChild(fname);

                    // Per-quiz badge
                    const qBadge = document.createElement('span');
                    let qbc = 'quiz-score-badge ';
                    if (qComplete) qbc += 'bg-green-900/60 text-green-400 border border-green-700/50';
                    else if (qs.correct > 0) qbc += 'bg-yellow-900/40 text-yellow-400 border border-yellow-700/50';
                    else qbc += 'bg-gray-700/50 text-gray-500 border border-gray-600/30';
                    qBadge.className = qbc;
                    qBadge.textContent = `${qs.correct}/${qs.total}`;

                    fileRow.appendChild(fileLeft);
                    fileRow.appendChild(qBadge);
                    fileRow.onclick = () => loadQuiz(fi);
                    children.appendChild(fileRow);
                });

                menuContainer.appendChild(children);

                // Toggle expand/collapse on folder click
                folderRow.onclick = () => {
                    mod.expanded = !mod.expanded;
                    buildSidebar();
                };
            });
        }

        // =====================================================================
        // Load quiz by flat index
        // =====================================================================
        function loadQuiz(flatIndex) {
            currentFlatIndex = flatIndex;
            const entry = flatQuizzes[flatIndex];
            const quiz = entry.quiz;

            sectionTitle.textContent = quiz.title;
            fileNameDisplay.textContent = `${entry.folder} / ${quiz.filename}`;
            feedbackMsg.innerHTML = '';

            // Ensure this module's folder is open
            modules[entry.moduleIdx].expanded = true;
            buildSidebar();

            // Highlight with Prism
            codeDisplay.textContent = quiz.code;
            Prism.highlightElement(codeDisplay);

            // Replace tokens with inputs
            let htmlContent = codeDisplay.innerHTML;
            quiz.answers.forEach((answer, i) => {
                const widthPx = Math.max(60, (answer.length * 8) + 16);
                const inputHtml = `<input type="text"
                    id="input-${i}"
                    data-answer="${answer}"
                    data-index="${i}"
                    class="code-blank"
                    style="width: ${widthPx}px"
                    autocomplete="off"
                    spellcheck="false">`;
                const regex = new RegExp(`__B${i}__`, 'g');
                htmlContent = htmlContent.replace(regex, inputHtml);
            });
            codeDisplay.innerHTML = htmlContent;

            // Line numbers
            const lineCount = quiz.code.split('\n').length;
            lineNumbersEl.innerHTML = Array.from({ length: lineCount }, (_, i) =>
                `<span class="line-num">${i + 1}</span>`
            ).join('');

            // Input listeners
            document.querySelectorAll('.code-blank').forEach(input => {
                input.addEventListener('input', () => {
                    input.classList.remove('incorrect');
                    input.placeholder = '';
                });
            });

            // Navigation
            prevBtn.classList.toggle('hidden', currentFlatIndex === 0);
            nextBtn.classList.toggle('hidden', currentFlatIndex === flatQuizzes.length - 1);
        }

        // =====================================================================
        // Check answers
        // =====================================================================
        checkBtn.addEventListener('click', () => {
            const inputs = document.querySelectorAll('.code-blank');
            let allCorrect = true;
            let newlyCorrect = 0;

            inputs.forEach(input => {
                if (input.classList.contains('correct')) return;

                const userVal = input.value.trim();
                const correctAns = input.dataset.answer;

                if (userVal === correctAns) {
                    input.classList.add('correct');
                    input.classList.remove('incorrect');
                    input.disabled = true;
                    newlyCorrect++;
                } else {
                    allCorrect = false;
                    input.classList.remove('animate-shake');
                    void input.offsetWidth;
                    input.classList.add('animate-shake', 'incorrect');
                    if (userVal !== '') input.value = '';
                    input.placeholder = correctAns;
                }
            });

            // Update scores
            globalScore += newlyCorrect;
            scoreDisplay.textContent = globalScore;

            quizScores[currentFlatIndex].correct += newlyCorrect;

            const entry = flatQuizzes[currentFlatIndex];
            moduleScores[entry.moduleIdx].correct += newlyCorrect;

            buildSidebar();

            // Feedback
            if (allCorrect) {
                feedbackMsg.innerHTML = `<span class="text-green-400 flex items-center"><svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> 0 Errors, 0 Warnings. Build Succeeded.</span>`;
            } else {
                feedbackMsg.innerHTML = `<span class="text-red-400 flex items-center"><svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg> Compilation Error: Please check the highlighted variables.</span>`;
            }
        });

        // =====================================================================
        // Navigation
        // =====================================================================
        prevBtn.addEventListener('click', () => {
            if (currentFlatIndex > 0) loadQuiz(currentFlatIndex - 1);
        });
        nextBtn.addEventListener('click', () => {
            if (currentFlatIndex < flatQuizzes.length - 1) loadQuiz(currentFlatIndex + 1);
        });

        // =====================================================================
        // Init
        // =====================================================================
        totalDisplay.textContent = totalBlanks;
        buildSidebar();
        loadQuiz(0);
    </script>
</body>

</html>
